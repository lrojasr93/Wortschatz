# Builds the Google Play app bundle (Trusted Web Activity for rumboalemania.com/app) from android/.
# The bundle is unsigned: it is signed with the private upload key outside GitHub before it goes to Play.
name: Android bundle
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned app bundle
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Publish the bundle as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | cut -d' ' -f2)
          T="android-v$V-unsigned"
          gh release delete "$T" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$T" android/app/build/outputs/bundle/release/app-release.aab -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Android v$V (sin firmar)" --notes "Paquete de Google Play sin firmar, versión $V. Se firma con la clave de subida antes de subirlo a Play Console."
