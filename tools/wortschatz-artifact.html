<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Wortschatz – German vocabulary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f7; --surface:#ffffff; --ink:#111b33; --muted:#5a6580; --line:#d5dbe8;
  --der:#2f64d6; --die:#8b3fd9; --das:#1f9462; --none:#6b7280; --bad:#d6334f; --irr:#b45309;
  --btn:#111b33; --btn-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#161e35; --ink:#e9edf8; --muted:#97a2bf; --line:#27324f;
    --der:#6b9cff; --die:#c49bff; --das:#4cd195; --none:#a3abb8; --bad:#ff7089; --irr:#f0a94b;
    --btn:#e9edf8; --btn-ink:#0e1424;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#161e35; --ink:#e9edf8; --muted:#97a2bf; --line:#27324f;
  --der:#6b9cff; --die:#c49bff; --das:#4cd195; --none:#a3abb8; --bad:#ff7089; --irr:#f0a94b;
  --btn:#e9edf8; --btn-ink:#0e1424;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--der);outline-offset:2px}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:14px 16px 6px}
h1{font-family:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;font-weight:800;font-size:clamp(20px,6vw,28px);letter-spacing:-.02em;line-height:1}
#stats{display:flex;gap:10px}
#stats div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
#stats b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:18px}
#stats .help{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;background:var(--surface);font-weight:600;font-size:14px;line-height:1;padding:0;align-self:center}
#stats .help[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:340px){header{padding:12px 10px 6px}#stats{gap:6px}#stats span{font-size:11px}#stats b{font-size:16px}h1{font-size:19px}}
.helpbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px;font-size:14px}
.helpbox p+p{margin-top:8px}
.helpbox .link{margin-top:6px}
#stats span{font-size:12px;color:var(--muted);white-space:nowrap}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 22px}
.rules-intro{margin-bottom:14px;color:var(--muted)}
details.rule{background:var(--surface);border:1px solid var(--line);border-left:12px solid var(--c);border-radius:6px;margin-bottom:10px}
details.rule summary{list-style:none;padding:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:18px}
details.rule summary::-webkit-details-marker{display:none}
details.rule summary::after{content:'+';font-size:22px;color:var(--muted)}
details.rule[open] summary::after{content:'\2013'}
.rule-body{padding:0 16px 16px}
.rt{margin-top:12px;font-weight:600}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip-ex{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:15px}
.warn{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px}
nav{display:grid;grid-template-columns:repeat(6,1fr);justify-content:space-between;padding:0 4px;background:var(--surface);border-top:1px solid var(--line)}
nav button{position:relative;background:none;border:0;padding:15px 2px;font-size:13px;letter-spacing:-.01em;font-weight:600;color:var(--muted);box-shadow:inset 0 3px 0 transparent}
nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}

.a-der{--c:var(--der)} .a-die{--c:var(--die)} .a-bad{--c:var(--bad)} .a-das{--c:var(--das)} .a-none{--c:var(--none)}
.art{color:var(--c);font-weight:600}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px}
.link{background:none;border:0;padding:4px 0;color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-left:12px solid var(--c,var(--none));border-radius:6px;padding:18px 18px 22px;min-height:290px;cursor:pointer;display:flex;flex-direction:column}
.card .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:auto;padding-bottom:26px}
.prompt{font-family:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;font-weight:800;font-size:clamp(36px,11.5vw,54px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.rev{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.ans{font-size:24px;font-weight:600;line-height:1.25}
.exrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:12px}
.exrow .ex{margin-top:0}
.exen{color:var(--muted);font-size:14px}
.icon{background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;color:var(--ink);flex:none}
@media (prefers-reduced-motion:no-preference){
  .card.pop{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}
}

.btn{padding:14px 16px;border-radius:8px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.wide{width:100%;margin-top:14px}
.btn.small{padding:10px 14px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

.panel,.done{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.panel h2,.done h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;letter-spacing:-.01em;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border:1px solid var(--line);background:transparent;border-radius:8px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg button.full{grid-column:1/-1}
.gaps{font-size:22px;line-height:1.45;font-weight:500;margin:6px 0 6px}
.gapb{display:inline-block;padding:0 4px;border-bottom:2px solid var(--ink);color:var(--muted);letter-spacing:.08em}
.gapw{padding:0 4px;border-radius:4px}
.gapw.gok{box-shadow:inset 0 -3px 0 var(--das)}
.gapw.gbad{box-shadow:inset 0 -3px 0 var(--bad)}
.ghint{font-size:14px;color:var(--muted);margin:10px 0 14px}
.gres{background:var(--surface);border:1px solid var(--line);border-left:12px solid var(--c,var(--none));border-radius:6px;padding:14px 16px;display:grid;gap:4px}
.pl{margin-top:8px;font-size:17px;color:var(--muted)}
.pl.small{margin-top:0;font-size:14px}
#tr-in{display:block;resize:vertical;font:inherit;color:inherit;margin-top:6px}
.trl{font-size:13px;color:var(--muted);margin-top:6px}
.trs{font-size:18px;line-height:1.6}
.tw{border-radius:3px;padding:0 2px}
.tline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:58px;padding:6px 0;border-bottom:2px solid var(--line);margin:10px 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.tile{font:inherit;font-size:17px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.tile.used{opacity:.25;cursor:default}
.trseg{grid-template-columns:repeat(3,1fr)}
.micw{display:grid;justify-items:center;gap:6px;margin:14px 0 4px}
.mic{width:76px;height:76px;border-radius:50%;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;cursor:pointer}
.mic svg{width:32px;height:32px}
.mic.on{animation:micp 1.2s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--btn) 45%,transparent)}50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--btn) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:3px solid var(--btn);outline-offset:4px}}
.tw.ok{box-shadow:inset 0 -3px 0 var(--das)}
.tw.near{background:color-mix(in srgb,#e8a400 28%,transparent)}
.tw.miss{box-shadow:inset 0 -3px 0 var(--bad);color:var(--bad);font-weight:600}
.tw.extra{text-decoration:line-through;color:var(--bad)}
.trkey{font-size:13px;color:var(--muted);margin-top:6px}
.vp{color:var(--muted)}
.rhint{font-size:13px;margin-top:6px;color:var(--muted)}
.rhint.r-ok{color:var(--das)}
.rhint.r-ex{color:#b77400}
.w .rhint{margin-top:2px}
@media (max-width:350px){nav{padding:0 2px}nav button{font-size:11.5px;padding:15px 1px}}
.badge{position:absolute;top:4px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;font-weight:700;letter-spacing:0}
.mbar{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:6px;font-size:15px;text-align:left}
.mbar b{color:var(--bad)}
.today{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.today .ring{flex:none}
.tt{display:grid;min-width:0;font-size:14px}
.tt span{color:var(--muted)}
.tt .nx{text-align:left;font-size:14px;margin-top:2px;padding:0}
.goalrow{display:flex;gap:16px;align-items:center}
.story{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:10px}
.story .tick{color:var(--das)}
.story .exen{display:block}
h2.st{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;margin:2px 0 10px}
.stext{font-size:18px;line-height:1.65;margin-top:14px}
.stext-en{margin-top:8px}
details.lvl{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
details.lvl.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
details.lvl summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
details.lvl summary::-webkit-details-marker{display:none}
details.lvl summary span{font-size:14px;color:var(--muted)}
.lvb{padding:0 14px 12px;display:grid;gap:8px}
.goalline{display:grid;grid-template-columns:1fr auto;gap:4px 8px;text-align:left;background:none;border:0;padding:4px 0;font:inherit;color:inherit;font-size:15px}
.goalline .prog{grid-column:1/-1;margin:0}
.gn{color:var(--muted);font-size:14px}
.chart{display:block;width:100%;height:auto;margin-top:6px}
.chart .cl{font-size:11px;fill:var(--muted)}
.chart .bar:hover path{opacity:1}
.catrow{margin-top:10px}
.catrow .ch{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.catrow .ch span{color:var(--muted);font-size:13px}
.catrow .prog{margin:4px 0 0}
.tbl{overflow-x:auto;margin-top:10px}
.ctab{border-collapse:collapse;width:100%;font-size:14px}
.ctab th,.ctab td{padding:6px 5px;text-align:left;border-bottom:1px solid var(--line)}
.ctab td.a-der{color:var(--der)}.ctab td.a-die{color:var(--die)}.ctab td.a-das{color:var(--das)}
.subnav{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.subnav button{padding:9px 6px;border:0;background:transparent;border-radius:6px;font-weight:600;color:var(--muted)}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.lvls button{padding:10px 4px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700}
.lvls button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .exen{display:block;margin-top:2px}
.opt .tick{float:right;color:var(--das);font-weight:700}
.cset{font-size:14px;color:var(--muted);margin:2px 0 12px}
.chat{display:grid;gap:8px;margin-bottom:10px}
.bub{max-width:88%;padding:10px 12px;border-radius:12px;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.bub.them{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{justify-self:end;background:color-mix(in srgb,var(--ink) 9%,var(--bg));border-bottom-right-radius:4px}
.bub.now{display:flex;gap:8px;align-items:flex-start;font-size:18px;max-width:100%}
.bub.now>div{flex:1;min-width:0}
.bub .en{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.bub .icon{flex:none;margin:-6px -6px -6px 0}
.task{font-weight:600;margin:6px 0 2px}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 6px}
.hints button{padding:9px 4px;border:1px dashed var(--line);background:transparent;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink)}
.hints button:disabled{border-style:solid;color:var(--muted)}
.hbox{font-size:15px;margin:6px 0;padding:8px 12px;border-left:3px solid var(--line)}
.hbox b{font-weight:600}
#cv-in{display:block;resize:vertical;font:inherit;color:inherit;margin-top:8px}
.fb{font-size:15px;margin-top:6px}
.qtop{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.link.exit{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 0 6px 12px}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vhead .qprompt{margin:6px 0}
.vcell{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted var(--line);text-underline-offset:3px}
.vcap{font-size:13px;color:var(--muted);padding:6px 5px 2px}
.vans{font-size:20px}
.vt td.vi .vcell,.vcap .vi,.vcap b.vi{color:var(--irr);font-weight:700}
.lessonbtn{display:grid;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--der);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.lessonbtn span{color:var(--muted);font-size:14px}
.vnext{line-height:1.8;margin:4px 0 0}
.vnext span{color:var(--muted);font-size:14px}
.pfs{display:none}
.vperf{display:none}
.kst{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.kst.m{color:var(--das)}
@media (max-width:420px){.kst .kt{display:none}.kst{font-size:15px}}
@media (max-width:360px){#stats{gap:5px}#stats span{font-size:10.5px}#stats b{font-size:15px}#stats .strk b::before{font-size:13px;margin-right:0}h1{font-size:18px}header{padding:12px 8px 6px}}
@media (max-width:599px){
  .vt .pc{display:none}
  .vperf{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:8px 5px 4px;border-top:1px solid var(--line);font-size:13px}
  .vperf .vph{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .vperf .vcell{padding:4px 0}
  .vperf .vcell.on{font-weight:700}
  .vperf .vpp{color:var(--muted)}
}
.vnote{margin:12px 0 0 18px;font-size:15px;display:grid;gap:4px}
.vtw{overflow-x:auto;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.vt{border-collapse:collapse;font-size:13px;width:100%}
.vt th,.vt td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.vt.wrap th,.vt.wrap td{white-space:normal;padding:6px 4px}
.rlink{display:block;margin-top:6px;font-weight:600}
.lvrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px}
.lvrow .lvt{font-weight:700}
.lvc{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.lvc.done{color:var(--das);border-color:var(--das)}
.lvh{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:22px 0 8px}
.lvt{background:var(--ink);color:var(--surface);border-radius:4px;padding:1px 7px;font-size:14px}
.lvt.lock{background:var(--line);color:var(--muted)}
.lvn{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.vt thead th{font-size:12px;color:var(--muted);font-weight:600}
.vt tbody th{color:var(--muted);font-weight:500}
.vt thead th.on{color:var(--ink)}
.vt tr.on td,.vt tr.on th{background:color-mix(in srgb,var(--ink) 7%,transparent);font-weight:600}
.note{margin-top:12px;color:var(--bad);font-size:14px}

.qn{color:var(--muted);font-size:14px}
.qlabel{margin-top:2px;color:var(--muted);font-size:14px}
.qprompt{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(32px,10vw,46px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:500}
.opt.ok{border-color:var(--das);box-shadow:inset 0 0 0 2px var(--das)}
.opt.bad{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.opt:disabled{opacity:1;cursor:default}
.score{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:56px;font-weight:800;line-height:1;margin:6px 0 10px}

.bar{display:flex;gap:10px;margin-bottom:10px}
input[type="search"],input[type="text"],textarea,#gap-in,#tr-in,#verb-in,#cv-in,#w-in,.form input,.form select{color:var(--ink);width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:16px;-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
.form{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.form label{font-size:14px;color:var(--muted);display:grid;gap:4px}
.w{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.wl{min-width:0}
.wde{display:block;font-weight:600;font-size:18px;overflow-wrap:anywhere}
.wen{color:var(--muted);font-size:15px}
.wr{display:flex;align-items:center;gap:8px;flex:none}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;background:var(--line);border-radius:1px}
.dots i.on{background:var(--c,var(--none))}
.del{background:none;border:0;color:var(--bad);font-size:13px;font-weight:600;padding:6px 4px}
.empty{color:var(--muted);padding:24px 0;text-align:center}

/* Design pass (Duolingo / Babbel / Anki patterns): tactile buttons, clear feedback, motion, streak, calendar */
:root{--fire:#ff8a00;--ok-bg:color-mix(in srgb,var(--das) 12%,var(--surface));--bad-bg:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.btn{box-shadow:0 3px 0 color-mix(in srgb,var(--btn) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn.ghost{box-shadow:0 3px 0 var(--line)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.opt{box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--das)}
.opt.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.prog{height:8px;border-radius:4px}
.prog i{border-radius:4px;background:var(--das);transition:width .3s ease-out}
.fbk{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:10px;font-weight:600}
.fbk.ok{background:var(--ok-bg);color:var(--das)}
.fbk.bad{background:var(--bad-bg);color:var(--bad)}
.fbk .ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.fbk.ok .ico{background:var(--das)}.fbk.bad .ico{background:var(--bad)}
.fbk span{color:var(--ink);font-weight:500}
main [data-a=qnext],main [data-a=vnext],main [data-a=trnext],main [data-a=cvnext],main [data-a=plnext]{position:sticky;bottom:10px;z-index:2}
#stats .strk b::before{content:'🔥';margin-right:2px;font-size:15px;filter:grayscale(1);opacity:.5}
#stats .strk.on b::before{filter:none;opacity:1}
#stats .strk.on b{color:var(--fire)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);white-space:nowrap}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--das) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--das) 65%,var(--line))}
.heat i.l3{background:var(--das)}
.heat i.fut{background:transparent}
.heatkey{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted);margin-top:6px}
.heatkey i{width:11px;height:11px;border-radius:2px;display:inline-block}
.sfx{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
@media (prefers-reduced-motion:no-preference){
  .opt.ok,.fbk.ok,.gres.a-das{animation:pop .22s ease-out}
  .opt.bad,.fbk.bad{animation:shake .35s ease-in-out}
  .fbk,.gres{animation-fill-mode:both}
  .toast{animation:toast 2.6s ease-out both}
  .done .score{animation:pop .35s ease-out}
  #stats .strk.on b::before{display:inline-block;animation:flame 2s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  @keyframes flame{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-6deg)}}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
}

Modal":"Modales","Work":"Trabajo","Present":"Presente","Perfect":"Perfecto","Mixed":"Mezcla","Perfect (Perfekt)":"Pretérito perfecto (Perfekt)","<div class=\"vperf\"><p class=\"vph\">Perfect</p>":"<div class=\"vperf\"><p class=\"vph\">Perfecto</p>",">Present</th><th":">Presente</th><th",">Past</th><th class=\"pc":">Pasado</th><th class=\"pc","</tbody></table><p class=\"vcap\">Tap any form to hear it. Perfect = ":"</tbody></table><p class=\"vcap\">Toca cualquier forma para escucharla. Perfecto = ","Modal verb: ich and er have the same form, with no ending (":"Verbo modal: ich y er tienen la misma forma, sin terminación (","). The second verb goes to the end as an infinitive.":"). El segundo verbo va al final en infinitivo.","Irregular present: ":"Presente irregular: ","Regular present: stem ":"Presente regular: raíz ","- + the normal endings.":"- + las terminaciones normales.","” goes to the end of the sentence.":"” va al final de la frase.","Irregular past: ":"Pasado irregular: ","Regular past: ":"Pasado regular: "," (stem + te).":" (raíz + te).","Perfect with ":"Perfecto con "," (irregular participle, ends in -en).":" (participio irregular, termina en -en).","<div class=\"vtw\"><table class=\"vt\"><thead><tr><th></th><th>Present</th><th>Past</th><th class=\"pc\">Perfect</th></tr></thead><tbody>":"<div class=\"vtw\"><table class=\"vt\"><thead><tr><th></th><th>Presente</th><th>Pasado</th><th class=\"pc\">Perfecto</th></tr></thead><tbody>","</tbody></table><p class=\"vcap\">Tap any form to hear it. <span class=\"vi\">Marked</span> forms are irregular. Perfect = ":"</tbody></table><p class=\"vcap\">Toca cualquier forma para escucharla. Las formas <span class=\"vi\">marcadas</span> son irregulares. Perfecto = ","<div class=\"qtop\"><button class=\"link exit\" data-a=\"vlesson\">✕ Close</button></div><h2 class=\"st\">How German verbs work</h2><p class=\"sub\">Six short lessons. Open one, read the examples and tap 🔊 to hear them.</p>":"<div class=\"qtop\"><button class=\"link exit\" data-a=\"vlesson\">✕ Cerrar</button></div><h2 class=\"st\">Cómo funcionan los verbos en alemán</h2><p class=\"sub\">Seis lecciones cortas. Abre una, lee los ejemplos y toca 🔊 para escucharlos.</p>","1 · Present tense: the endings":"1 · Presente: las terminaciones","<p class=\"sub\" style=\"margin:6px 0 0\">Take the infinitive, remove <b>-en</b> to get the stem (mach<b>en</b> → mach-), then add an ending for each person.</p>":"<p class=\"sub\" style=\"margin:6px 0 0\">Toma el infinitivo, quita <b>-en</b> para obtener la raíz (mach<b>en</b> → mach-) y añade una terminación para cada persona.</p>","<p class=\"warn\">If the stem ends in -t or -d, add an e: du arbeit<b>est</b>, er arbeit<b>et</b>. If it ends in -s, -ß or -z, du only adds -t: du heiß<b>t</b>.</p>":"<p class=\"warn\">Si la raíz termina en -t o -d, añade una e: du arbeit<b>est</b>, er arbeit<b>et</b>. Si termina en -s, -ß o -z, con du solo se añade -t: du heiß<b>t</b>.</p>","2 · Stem changes (only du and er/sie/es)":"2 · Cambios en la raíz (solo du y er/sie/es)","<p class=\"sub\" style=\"margin:6px 0 0\">Many common verbs change their vowel, but only for <b>du</b> and <b>er/sie/es</b>. The endings stay the same.</p>":"<p class=\"sub\" style=\"margin:6px 0 0\">Muchos verbos comunes cambian su vocal, pero solo con <b>du</b> y <b>er/sie/es</b>. Las terminaciones no cambian.</p>","3 · Separable verbs":"3 · Verbos separables","<p class=\"sub\" style=\"margin:6px 0 0\">Verbs like <b>auf</b>stehen, <b>an</b>rufen or <b>ein</b>kaufen split in a sentence: the verb is in position 2 and the prefix goes to the very end.</p>":"<p class=\"sub\" style=\"margin:6px 0 0\">Verbos como <b>auf</b>stehen, <b>an</b>rufen o <b>ein</b>kaufen se separan en la oración: el verbo va en la posición 2 y el prefijo va al final.</p>","<p class=\"warn\">In the perfect, ge- goes in the middle: aufgestanden, angerufen, eingekauft.</p>":"<p class=\"warn\">En el Perfekt, ge- va en medio: aufgestanden, angerufen, eingekauft.</p>","4 · Modal verbs":"4 · Verbos modales","<p class=\"sub\" style=\"margin:6px 0 0\">können, müssen, wollen, dürfen, sollen, mögen. ich and er/sie/es look the same and have no ending. The second verb goes to the end as an infinitive.</p>":"<p class=\"sub\" style=\"margin:6px 0 0\">können, müssen, wollen, dürfen, sollen, mögen. ich y er/sie/es son iguales y no llevan terminación. El segundo verbo va al final en infinitivo.</p>","<p class=\"sub\" style=\"margin:6px 0 0\">Regular verbs add <b>-te</b> to the stem: mach<b>te</b>, lern<b>te</b>, arbeit<b>ete</b>. Irregular verbs get a new stem: gehen → <b>ging</b>, kommen → <b>kam</b>, sprechen → <b>sprach</b>.</p>":"<p class=\"sub\" style=\"margin:6px 0 0\">Los verbos regulares añaden <b>-te</b> a la raíz: mach<b>te</b>, lern<b>te</b>, arbeit<b>ete</b>. Los irregulares cambian de raíz: gehen → <b>ging</b>, kommen → <b>kam</b>, sprechen → <b>sprach</b>.</p>","<p class=\"warn\">ich and er/sie/es are the same. In speech Germans use the Präteritum mostly for sein (war), haben (hatte) and the modal verbs (konnte, musste). For other verbs they use the perfect.</p>":"<p class=\"warn\">ich y er/sie/es son iguales. Al hablar, los alemanes usan el Präteritum sobre todo con sein (war), haben (hatte) y los verbos modales (konnte, musste). Para los demás verbos usan el Perfekt.</p>","6 · Perfect (Perfekt): the spoken past":"6 · Perfekt: el pasado hablado","<p class=\"sub\" style=\"margin:6px 0 0\"><b>haben</b> or <b>sein</b> in position 2, and the participle at the end.</p>":"<p class=\"sub\" style=\"margin:6px 0 0\"><b>haben</b> o <b>sein</b> en la posición 2, y el participio al final.</p>","ge + stem + t":"ge + raíz + t","ge + stem + en":"ge + raíz + en","prefix + ge + …":"prefijo + ge + …","<p class=\"warn\">Use <b>sein</b> with movement from A to B (gehen, fahren, kommen, fliegen) and change of state (werden, aufstehen), plus sein and bleiben. Everything else uses haben.</p>":"<p class=\"warn\">Usa <b>sein</b> con movimiento de A a B (gehen, fahren, kommen, fliegen) y cambio de estado (werden, aufstehen), además de sein y bleiben. Todo lo demás usa haben.</p>","<button class=\"btn wide\" data-a=\"vlesson\">Back to verbs</button>":"<button class=\"btn wide\" data-a=\"vlesson\">Volver a verbos</button>","<button class=\"lessonbtn\" data-a=\"vlesson\"><b>How German verbs work</b><span>Endings, stem changes, separable and modal verbs, past and perfect. Start here.</span></button>":"<button class=\"lessonbtn\" data-a=\"vlesson\"><b>Cómo funcionan los verbos alemanes</b><span>Terminaciones, cambios de raíz, verbos separables y modales, pasado y Perfekt. Empieza aquí.</span></button>","<div class=\"panel\"><h2>Learn new verbs</h2><p class=\"sub\">Study 5 verbs at a time: meaning, all forms with sound, and an example. Then a short practice on just those 5. ":"<div class=\"panel\"><h2>Aprende verbos nuevos</h2><p class=\"sub\">Estudia 5 verbos a la vez: significado, todas las formas con audio y un ejemplo. Luego, una práctica corta solo con esos 5. "," verbs studied here.</p>":" verbos estudiados aquí.</p>","<p class=\"qlabel\">Next up</p><p class=\"vnext\">":"<p class=\"qlabel\">A continuación</p><p class=\"vnext\">","<button class=\"btn wide\" data-a=\"vlstart\">Study these 5 verbs</button>":"<button class=\"btn wide\" data-a=\"vlstart\">Estudiar estos 5 verbos</button>","<p class=\"sub\">You have studied every verb in this group. Keep them fresh in Practice, or study 5 of them again.</p><button class=\"btn wide\" data-a=\"vlstart\" data-r=\"1\">Study 5 again</button>":"<p class=\"sub\">Ya estudiaste todos los verbos de este grupo. Mantenlos frescos en Practicar o estudia 5 otra vez.</p><button class=\"btn wide\" data-a=\"vlstart\" data-r=\"1\">Estudiar 5 otra vez</button>","<div class=\"qtop\"><button class=\"link exit\" data-a=\"vlexit\">✕ Exit</button></div><div class=\"prog\"><i style=\"width:":"<div class=\"qtop\"><button class=\"link exit\" data-a=\"vlexit\">✕ Salir</button></div><div class=\"pro data-a=\"addsave\">Save word</button>":"<button class=\"btn\" data-a=\"addsave\">Guardar palabra</button>","Masculine":"Masculino","Days, months and seasons":"Días, meses y estaciones","Weather and compass points":"Clima y puntos cardinales","People who do something (-er)":"Personas que hacen algo (-er)","Endings -ling, -ismus, -ist, -or":"Terminaciones -ling, -ismus, -ist, -or","Most alcoholic drinks":"La mayoría de las bebidas alcohólicas","Exceptions: das Bier is neuter. Not every -er word is masculine: die Butter, das Fenster, das Zimmer.":"Excepciones: das Bier es neutro. No todas las palabras en -er son masculinas: die Butter, das Fenster, das Zimmer.","Feminine":"Femenino","Endings -ung, -heit, -keit, -schaft":"Terminaciones -ung, -heit, -keit, -schaft","Female people (-in)":"Mujeres (-in)","Most nouns ending in -e":"La mayoría de los sustantivos terminados en -e","Many trees and flowers":"Muchos árboles y flores","Every plural, whatever the gender":"Todos los plurales, sin importar el género","Exceptions to the -e rule: der Käse, der Name, das Ende.":"Excepciones a la regla de -e: der Käse, der Name, das Ende.","Neuter":"Neutro","Small things (-chen, -lein)":"Cosas pequeñas (-chen, -lein)","Verbs used as nouns":"Verbos usados como sustantivos","Endings -ment, -um, -ma":"Terminaciones -ment, -um, -ma","Young people and animals":"Personas y animales jóvenes","Metals and chemical elements":"Metales y elementos químicos","Often start with Ge-":"Suelen empezar con Ge-","Languages and colors as nouns":"Idiomas y colores como sustantivos","Ge- is only a hint: der Gesang and die Gefahr are not neuter.":"Ge- es solo una pista: der Gesang y die Gefahr no son neutros.","Days, months and seasons are der":"Los días, meses y estaciones son der","Weather words are der":"Las palabras del clima son der","Most alcoholic drinks are der":"La mayoría de las bebidas alcohólicas son der","Plural-only word: plurals are always die":"Palabra solo en plural: los plurales siempre son die","Exception: ":"Excepción: ",", but this one is ":", pero esta es ","Male people who do something (-er) are der":"Los hombres que hacen algo (-er) son der","Compound word: it takes the gender of its last part, ":"Palabra compuesta: toma el género de su última parte, ","Exception: most alcoholic drinks are der, but beer is das":"Excepción: la mayoría de las bebidas alcohólicas son der, pero la cerveza es das","Female people ending in -in are die":"Las mujeres terminadas en -in son die","Verbs used as nouns are das":"Los verbos usados como sustantivos son das","Words ending in -":"Las palabras terminadas en -","Exception: words ending in -":"Excepción: las palabras terminadas en -"," are usually ":" suelen ser ","Male people ending in -e are der":"Los hombres terminados en -e son der","Most nouns ending in -e are die":"La mayoría de los sustantivos terminados en -e son die","Exception: most nouns ending in -e are die, but this one is ":"Excepción: la mayoría de los sustantivos terminados en -e son die, pero esta es ","Nouns starting with Ge- are often das":"Los sustantivos que empiezan con Ge- suelen ser das","Exception: nouns starting with Ge- are often das, but this one is ":"Excepción: los sustantivos que empiezan con Ge- suelen ser das, pero esta es ","No rule: learn this one by heart":"Sin regla: apréndela de memoria","<p class=\"rules-intro\">Patterns help you guess, but German has many exceptions. The safest habit is to learn every noun together with its article.</p>":"<p class=\"rules-intro\">Los patrones te ayudan a adivinar, pero el alemán tiene muchas excepciones. Lo más seguro es aprender cada sustantivo junto con su artículo.</p>","<details class=\"rule a-none\"><summary><span>Compound words</span></summary><div class=\"rule-body\">":"<details class=\"rule a-none\"><summary><span>Palabras compuestas</span></summary><div class=\"rule-body\">","<p class=\"rt\">A compound noun takes the gender of its last word</p><div class=\"exs\">":"<p class=\"rt\">Un sustantivo compuesto toma el género de su última palabra</p><div class=\"exs\">","<details class=\"rule a-none\"><summary><span>No rule · learn by heart</span></summary><div class=\"rule-body\">":"<details class=\"rule a-none\"><summary><span>Sin regla · de memoria</span></summary><div class=\"rule-body\">","<p class=\"rt\">Many common nouns, especially short ones, follow no pattern</p>":"<p class=\"rt\">Muchos sustantivos comunes, sobre todo los cortos, no siguen ningún patrón</p>","<p class=\"sub\" style=\"margin:6px 0 0\">Words like die Post, die Hand or der Tisch don’t match any ending or group above. Nothing in the word tells you the gender, so you have to learn the article together with the word.</p>":"<p class=\"sub\" style=\"margin:6px 0 0\">Palabras como die Post, die Hand o der Tisch no coinciden con ninguna terminación ni grupo de arriba. Nada en la palabra te dice el género, así que tienes que aprender el artículo junto con la palabra.</p>","<p class=\"rt\">Examples</p><div class=\"exs\">":"<p class=\"rt\">Ejemplos</p><div class=\"exs\">","<p class=\"rt\">How to learn them</p><p class=\"sub\" style=\"margin:6px 0 0\">Always say the article out loud with the word (“die Post”, not “Post”). Use the colors: blue der, purple die, green das. Practice them in the der / die / das quiz.</p>":"<p class=\"rt\">Cómo aprenderlos</p><p class=\"sub\" style=\"margin:6px 0 0\">Di siempre el artículo en voz alta con la palabra (“die Post”, no “Post”). Usa los colores: azul der, morado die, verde das. Practícalos en el quiz de der / die / das.</p>","<p class=\"warn\">Weak hint: many one-syllable nouns are der (der Tisch, der Weg), but there are lots of exceptions (die Hand, das Bett).</p></div></details>":"<p class=\"warn\">Pista débil: muchos sustantivos de una sílaba son der (der Tisch, der Weg), pero hay muchas excepciones (die Hand, das Bett).</p></div></details>","<p class=\"sub\" style=\"margin:12px 0\">Every noun card in Learn and Words shows which rule it follows, or that it has none.</p>":"<p class=\"sub\" style=\"margin:12px 0\">Cada tarjeta de sustantivo en Aprender y Palabras muestra qué regla sigue, o si no tiene ninguna.</p>","<button class=\"btn wide\" data-a=\"qart\">Practice with the article quiz</button>":"<button class=\"btn wide\" data-a=\"qart\">Practica con el quiz de artículos</button>","Correct answer: <span>":"Respuesta correcta: <span>","</div><div class=\"heatkey\">Less <i style=\"background:var(--line)\"></i><i class=\"l1\" style=\"background:color-mix(in srgb,var(--das) 35%,var(--line))\"></i><i style=\"background:color-mix(in srgb,var(--das) 65%,var(--line))\"></i><i style=\"background:var(--das)\"></i> Goal reached</div>":"</div><div class=\"heatkey\">Menos <i style=\"background:var(--line)\"></i><i class=\"l1\" style=\"background:color-mix(in srgb,var(--das) 35%,var(--line))\"></i><i style=\"background:color-mix(in srgb,var(--das) 65%,var(--line))\"></i><i style=\"background:var(--das)\"></i> Meta cumplida</div>","🎉 Daily goal reached: ":"🎉 ¡Meta diaria cumplida: "," answers!":" respuestas!","Daily goal reached. Great work!":"Meta diaria cumplida. ¡Buen trabajo!","Only ":"Solo "," more today to keep your goal.":" más hoy para mantener tu meta."," more answers to reach today’s goal.":" respuestas más para alcanzar la meta de hoy.","\">Next up: ":"\">Siguiente: ","Master ":"Domina ","Finish the ":"Termina las conversaciones de ","Read the ":"Lee las historias de "," right answers in Cases":" respuestas correctas en Casos","take the placement test":"haz la prueba de nivel","<div class=\"done\"><h2>Your level: ":"<div class=\"done\"><h2>Tu nivel: ","</p><p class=\"sub\">Your path starts at ":"</p><p class=\"sub\">Tu camino empieza en ","The levels below are marked as passed, but you can still practice them.":"Los niveles anteriores quedan marcados como superados, pero aún puedes practicarlos.","</p><button class=\"btn wide\" data-a=\"plclose\">See my path</button></div>":"</p><button class=\"btn wide\" data :"</b><span>dominadas</span></div><button class=\"help\" data-a=\"help\" aria-label=\"¿Qué significan estos números?\" aria-expanded=\"","Meanings, translations, lessons and buttons use this language. Your progress stays the same.":"Los significados, traducciones, lecciones y botones usan este idioma. Tu progreso no cambia.","Eight short lessons. Open one, read the examples and tap 🔊 to hear them.":"Ocho lecciones cortas. Abre una, lee los ejemplos y toca 🔊 para escucharlos.","7 · Irregular verbs: what exactly changes":"7 · Verbos irregulares: qué cambia exactamente","An irregular verb can change in three places, and each one is separate. gehen is regular in the present but irregular in the past (ging). wissen is irregular in the present (ich weiß) and only half irregular in the past (wusste).":"Un verbo irregular puede cambiar en tres lugares, y cada uno es independiente. gehen es regular en presente pero irregular en pasado (ging). wissen es irregular en presente (ich weiß) y solo a medias en pasado (wusste).","Where":"Dónde","What changes":"Qué cambia","Example":"Ejemplo","Participle":"Participio","only du and er/sie/es, the vowel":"solo du y er/sie/es, la vocal","new stem, no -te; ich and er have no ending":"raíz nueva, sin -te; ich y er sin terminación","ends in -en, often with a new vowel":"termina en -en, muchas veces con otra vocal","Present: which verbs change their vowel":"Presente: qué verbos cambian la vocal","wir, ihr and sie never change: wir fahren, ihr fahrt. Also watch the consonants: nehmen → du nimmst, er nimmt. halten → du hältst, er hält (no extra -et).":"wir, ihr y sie nunca cambian: wir fahren, ihr fahrt. Ojo también con las consonantes: nehmen → du nimmst, er nimmt. halten → du hältst, er hält (sin -et extra).","Past and participle: the vowel patterns":"Pretérito y participio: los patrones de vocales","Strong verbs follow a few vowel patterns. Learn the three forms together, like a song: trinken, trank, getrunken.":"Los verbos fuertes siguen unos pocos patrones de vocales. Aprende las tres formas juntas, como una canción: trinken, trank, getrunken.","Pattern":"Patrón","Also":"También","Mixed verbs: -te and a new vowel":"Verbos mixtos: -te y otra vocal","A few verbs take the regular -te and ge…t, but still change their stem.":"Algunos verbos llevan el -te y el ge…t regulares, pero igual cambian la raíz.","In the Verbs list, every verb card marks its irregular forms in color, so you can see exactly which persons and tenses change.":"En la lista de verbos, cada tarjeta marca en color sus formas irregulares, así ves exactamente qué personas y tiempos cambian.","8 · Full tables: sein, haben, werden, wissen and the modal verbs":"8 · Tablas completas: sein, haben, werden, wissen y los verbos modales","These are the most used verbs in German and the most irregular. Learn them by heart.":"Son los verbos más usados del alemán y los más irregulares. Apréndelos de memoria.","Past":"Pasado","Modal verbs":"Verbos modales","Modal verbs have no ending for ich and er, and most lose their umlaut in the singular (können → ich kann) and in the past (konnte, musste, durfte). möchten (would like) is a polite form of mögen. Its past is wollte.":"Los verbos modales no tienen terminación con ich y er, y la mayoría pierde la diéresis en singular (können → ich kann) y en pasado (konnte, musste, durfte). möchten (me gustaría) es una forma cortés de mögen. Su pasado es wollte.","Mixed verb: regular -te, but the stem changes: ":"Verbo mixto: -te regular, pero la raíz cambia: ","Endings, stem changes, separable and modal verbs, past and perfect, irregular verbs and full tables. Start here.":"Terminaciones, cambios de raíz, verbos separables y modales, pasado y perfecto, verbos irregulares y tablas completas. Empieza aquí.","Prepositions + article · im, am, zum":"Preposición + artículo · im, am, zum","Some prepositions merge with dem, der or das into one short word.":"Algunas preposiciones se juntan con dem, der o das en una sola palabra corta.","Dativ (where? with whom?)":"Dativ (¿dónde? ¿con quién?)","Akkusativ (where to?)":"Akkusativ (¿hacia dónde?)","Spoken, optional in writing":"Hablado, opcional al escribir","Always the short form in fixed phrases":"Siempre la forma corta en frases hechas","Use the long form when you mean one specific thing (this one, that one) or when a relative clause follows":"Usa la forma larga cuando hablas de una cosa específica (esta, esa) o cuando sigue una oración de relativo","No short form with die or plurals":"Sin forma corta con die ni con plurales","Only zu der becomes zur. in die, an die, auf die and every plural (in den, zu den) stay as two words.":"Solo zu der se vuelve zur. in die, an die, auf die y todos los plurales (in den, zu den) quedan como dos palabras.","Practice im, am, zum…":"Practicar im, am, zum…","Prepositions + article · ":"Preposición + artículo · ","Done! ":"¡Listo! "," right.":" correctas.","Practice again":"Practicar otra vez","Back to rules":"Volver a las reglas","✕ Exit":"✕ Salir","in + dem = im. Where? → Dativ.":"in + dem = im. ¿Dónde? → Dativ.","in + das = ins. Where to? → Akkusativ.":"in + das = ins. ¿Hacia dónde? → Akkusativ.","Days of the week: an + dem = am.":"Días de la semana: an + dem = am.","die Arbeit is feminine: zu + der = zur.":"die Arbeit es femenino: zu + der = zur.","der Bahnhof is masculine: zu + dem = zum.":"der Bahnhof es masculino: zu + dem = zum.","bei + dem = beim.":"bei + dem = beim.","von + dem = vom.":"von + dem = vom.","das Meer, where to? an + das = ans.":"das Meer, ¿hacia dónde? an + das = ans.","Months: in + dem = im.":"Meses: in + dem = im.","Fixed phrase: ins Bett gehen.":"Frase hecha: ins Bett gehen.","der Stadtrand, where? an + dem = am.":"der Stadtrand, ¿dónde? an + dem = am.","die Stadt, where to? in + die has no short form.":"die Stadt, ¿hacia dónde? in + die no tiene forma corta.","die Stadt, where? in + der has no short form.":"die Stadt, ¿dónde? in + der no tiene forma corta.","Fixed phrase: zum Beispiel.":"Frase hecha: zum Beispiel.","der Tisch, where? auf + dem has no short form.":"der Tisch, ¿dónde? auf + dem no tiene forma corta.","das Regal, where to? auf + das = aufs (spoken; auf das is also correct).":"das Regal, ¿hacia dónde? auf + das = aufs (hablado; auf das también es correcto).","die Freunde is plural: zu den has no short form.":"die Freunde es plural: zu den no tiene forma corta.","Seasons: in + dem = im.":"Estaciones: in + dem = im.","5 · Simple past (Präteritum)":"5 · Pasado simple (Präteritum)","Present tense: the endings":"Presente: las terminaciones","Stem changes (only du and er/sie/es)":"Cambios en la raíz (solo du y er/sie/es)","Separable verbs":"Verbos separables","Perfect (Perfekt): the spoken past":"Perfekt: el pasado hablado","Irregular verbs: what exactly changes":"Verbos irregulares: qué cambia exactamente","Full tables: sein, haben, werden, wissen and the modal verbs":"Tablas completas: sein, haben, werden, wissen y los verbos modales","Simple past (Präteritum)":"Pasado simple (Präteritum)","<div class=\"qtop\"><button class=\"link exit\" data-a=\"vlesson\">✕ Close</button></div><h2 class=\"st\">How German verbs work</h2>":"<div class=\"qtop\"><button class=\"link exit\" data-a=\"vlesson\">✕ Cerrar</button></div><h2 class=\"st\">Cómo funcionan los verbos en alemán</h2>","<button class=\"lessonbtn\" data-a=\"vlesson\"><b>How German verbs work</b>":"<button class=\"lessonbtn\" data-a=\"vlesson\"><b>Cómo funcionan los verbos alemanes</b>","Short lessons, ordered by level. Open one, read the examples and tap 🔊 to hear them.":"Lecciones cortas, ordenadas por nivel. Abre una, lee los ejemplos y toca 🔊 para escucharlos.","Show the LV lessons anyway":"Ver las lecciones de LV de todas formas","Show the LV rules anyway":"Ver las reglas de LV de todas formas","Earlier level":"Nivel anterior","Your level":"Tu nivel","Coming later":"Más adelante"," practices passed":" prácticas aprobadas","Practice: ":"Práctica: ","Not practiced yet. Pass with 8 of 10.":"Aún sin practicar. Se aprueba con 8 de 10.","Best: ":"Mejor resultado: "," · passed":" · aprobada"," · pass with 8 of 10":" · se aprueba con 8 de 10","Read the lessons":"Leer las lecciones","Rules are ordered by level, from simple to complex. Start with your level. Passing a level’s practices (8 of 10) counts toward that level in your path.":"Las reglas están ordenadas por nivel, de lo simple a lo complejo. Empieza por tu nivel. Aprobar las prácticas de un nivel (8 de 10) cuenta para ese nivel en tu ruta.","No new rules for B2 yet. Keep going with the conversations and stories.":"Todavía no hay reglas nuevas para B2. Sigue con las conversaciones y las historias.","Passed. It counts toward your ":"Aprobada. Cuenta para tu meta de "," goal.":".","You need 8 of 10 to pass. Try again when you are ready.":"Necesitas 8 de 10 para aprobar. Inténtalo otra vez cuando quieras.","Pass the ":"Aprobar las prácticas de reglas de "," rule practices":"","Noun gender: der, die, das":"Género de los sustantivos: der, die, das","Verbs: present, separable and modal":"Verbos: presente, separables y modales","Prepositions + article: im, am, zum":"Preposición + artículo: im, am, zum","Plurals":"Plurales","Verbs: simple past and perfect":"Verbos: pasado simple y perfecto","Irregular verbs: past and participle":"Verbos irregulares: pasado y participio","Plurals · die Kinder, die Häuser":"Plurales · die Kinder, die Häuser","German has several plural endings. These patterns cover most nouns. In the plural the article is always die.":"El alemán tiene varias terminaciones de plural. Estos patrones cubren la mayoría de los sustantivos. En plural el artículo siempre es die.","no change (sometimes ¨)":"sin cambio (a veces ¨)","many der nouns":"muchos sustantivos der","+ e (often ¨)":"+ e (a menudo ¨)","short das nouns":"sustantivos das cortos","+ er (with ¨)":"+ er (con ¨)","vowel at the end, foreign words":"terminan en vocal, palabras extranjeras","Dativ plural adds -n: mit den Kindern (unless the plural ends in -n or -s: mit den Autos). Every noun card shows its plural, so learn it together with the word.":"El Dativ plural agrega -n: mit den Kindern (salvo que el plural termine en -n o -s: mit den Autos). Cada tarjeta muestra el plural, así que apréndelo junto con la palabra.","-ung → always die.":"-ung → siempre die.","-chen → always das, even for a girl.":"-chen → siempre das, incluso para una niña.","Female people ending in -in → die.":"Mujeres con -in → die.","Days, months and seasons → der.":"Días, meses y estaciones → der.","-heit → always die.":"-heit → siempre die.","-ment → das.":"-ment → das.","Compound: the last part decides. der Schrank → der Kühlschrank.":"Compuesto: decide la última parte. der Schrank → der Kühlschrank.","-tät → die.":"-tät → die.","Verbs used as nouns → das.":"Verbos usados como sustantivos → das.","-ismus → der.":"-ismus → der.","Most nouns ending in -e → die.":"La mayoría de los sustantivos en -e → die.","Seasons → der.":"Estaciones → der.","Compound: das Haus → das Krankenhaus.":"Compuesto: das Haus → das Krankenhaus.","-schaft → die.":"-schaft → die.","-chen → das.":"-chen → das.","-ion → die.":"-ion → die.","e → i for du and er: du sprichst.":"e → i con du y er: du sprichst.","e → ie for du and er: er sieht.":"e → ie con du y er: er sieht.","a → ä for du and er/sie/es: sie fährt.":"a → ä con du y er/sie/es: sie fährt.","ihr → -t.":"ihr → -t.","The stem ends in -t, so add an e: du arbeitest.":"La raíz termina en -t, así que se agrega una e: du arbeitest.","The stem ends in -ß, so du only adds -t.":"La raíz termina en -ß, así que du solo agrega -t.","Separable: the verb is in position 2 and auf goes to the end.":"Separable: el verbo va en la posición 2 y auf va al final.","Separable: rufe … an.":"Separable: rufe … an.","Modal verbs: ich and er have no ending. er kann.":"Verbos modales: ich y er no tienen terminación. er kann.","ich möchte: the polite way to say what you want.":"ich möchte: la forma cortés de decir lo que quieres.","wir looks like the infinitive: wir müssen.":"wir es igual al infinitivo: wir müssen.","Modal verbs lose the umlaut in the singular: du darfst.":"Los modales pierden la diéresis en singular: du darfst.","sein: ich bin, du bist, er ist.":"sein: ich bin, du bist, er ist.","haben: du hast, er hat.":"haben: du hast, er hat.","Feminine nouns ending in -e add -n.":"Los femeninos en -e agregan -n.","-ung adds -en.":"-ung agrega -en.","-in adds -nen.":"-in agrega -nen.","der and das nouns ending in -er don’t change.":"Los sustantivos der y das en -er no cambian.","-chen doesn’t change.":"-chen no cambia.","Nouns ending in a vowel (not -e) and foreign words add -s.":"Los que terminan en vocal (no -e) y las palabras extranjeras agregan -s.","Short das nouns often add -er.":"Los sustantivos das cortos suelen agregar -er.","Short das nouns add -er, often with an umlaut.":"Los sustantivos das cortos agregan -er, a menudo con diéresis.","Many der nouns add -e.":"Muchos sustantivos der agregan -e.","Many der nouns add -e, often with an umlaut.":"Muchos sustantivos der agregan -e, a menudo con diéresis.","-ion adds -en.":"-ion agrega -en.","Foreign words add -s.":"Las palabras extranjeras agregan -s.","-er nouns get no ending, sometimes an umlaut.":"Los sustantivos en -er no llevan terminación, a veces diéresis.","Dativ plural adds -n, unless the plural already ends in -n or -s.":"El Dativ plural agrega -n, salvo que el plural ya termine en -n o -s.","Simple past of sein: war.":"Pasado simple de sein: war.","wir hatten.":"wir hatten.","Movement from A to B → sein: ich bin gefahren.":"Movimiento de A a B → sein: ich bin gefahren.","Most verbs use haben.":"La mayoría de los verbos usa haben.","Separable: ge- goes in the middle.":"Separable: ge- va en el medio.","Verbs ending in -ieren have no ge-.":"Los verbos en -ieren no llevan ge-.","Regular: ge + stem + t.":"Regular: ge + raíz + t.","Verbs with ver-, be- or er- have no ge-.":"Los verbos con ver-, be- o er- no llevan ge-.","Modal verbs in the past: konnte, musste, wollte.":"Modales en pasado: konnte, musste, wollte.","bleiben takes sein: ist geblieben.":"bleiben va con sein: ist geblieben.","Irregular participle: gegessen.":"Participio irregular: gegessen.","In speech, sein uses the simple past: ich war.":"Al hablar, sein usa el pasado simple: ich war.","Pattern i → a → u.":"Patrón i → a → u.","Pattern e → a → o.":"Patrón e → a → o.","Pattern ei → ie → ie.":"Patrón ei → ie → ie.","Pattern ie → o → o.":"Patrón ie → o → o.","Mixed verb: -te plus a new stem.":"Verbo mixto: -te y una raíz nueva.","Mixed verb: ge…t with a new stem.":"Verbo mixto: ge…t con una raíz nueva.","Pattern a → u → a.":"Patrón a → u → a.","Pattern a → ie → a.":"Patrón a → ie → a.","Mixed verb: wusste, gewusst.":"Verbo mixto: wusste, gewusst.","Pattern e → a → o, with mm.":"Patrón e → a → o, con mm.","Pattern e → a → e.":"Patrón e → a → e.","Mixed verb: kannte, gekannt.":"Verbo mixto: kannte, gekannt.","A word is mastered when you type it right, with its article, in Practice → Write the word on 2 different days. A wrong answer starts it over.":"Una palabra queda dominada cuando la escribes bien, con su artículo, en Practicar → Escribe la palabra en 2 días distintos. Una respuesta incorrecta la reinicia.","Halfway now: ":"A medio camino: "," words (right on one day).":" palabras (bien en un día).","A verb is mastered after 3 right answers in a row in Verbs → Practice, the verb lessons or verb challenges. A wrong answer or a skip starts it over.":"Un verbo queda dominado con 3 respuestas correctas seguidas en Verbos → Practicar, en las lecciones de verbos o en los desafíos de verbos. Un error o saltarlo lo reinicia.","Opportunities":"Oportunidades","<button class=\"mbar\" data-a=\"mopen\"><span>My opportunities</span><b>":"<button class=\"mbar\" data-a=\"mopen\"><span>Mis oportunidades</span><b>","</p><button class=\"btn wide\" data-a=\"mopen\">Back to my opportunities</button></div>":"</p><button class= rrecto","Show the answer":"Ver la respuesta","Type it":"Escríbela","Your answer":"Tu respuesta","Start":"Empezar","Build it":"Ármala","Say it":"Dila","Practice whole sentences: you get one in English and answer in German.":"Practica frases completas: ves una en español y respondes en alemán.","Tap the German words in the right order. Good for learning word order, like the verb in second place.":"Toca las palabras en alemán en el orden correcto. Sirve para aprender el orden de la frase, como el verbo en segundo lugar.","Say the sentence out loud in German and the app checks what it hears. Speaking fixes words in memory better than reading them.":"Di la frase en voz alta en alemán y la app revisa lo que escucha. Hablar fija las palabras en la memoria mejor que leerlas.","Your browser can’t listen, so you say the sentence out loud, then compare it with the answer and mark it yourself. This practice doesn’t change your progress.":"Tu navegador no puede escuchar, así que dices la frase en voz alta, la comparas con la respuesta y te corriges tú. Esta práctica no cambia tu progreso.","Type the sentence. Small typos count as almost right, and umlauts can be typed as ae, oe, ue and ß as ss.":"Escribe la frase. Los errores pequeños cuentan como casi bien, y puedes escribir las diéresis como ae, oe, ue y la ß como ss.","Sentences up to your level, LV.":"Frases hasta tu nivel, LV.","Build this in German":"Arma esto en alemán","Say this in German":"Di esto en alemán","Your sentence":"Tu frase","Tap the words below":"Toca las palabras de abajo","Speak":"Hablar","Listening… say the sentence now.":"Escuchando… di la frase ahora.","Tap the microphone and say it.":"Toca el micrófono y dila.","Say it out loud in German, then check.":"Dila en voz alta en alemán y luego revisa.","Did you say it right?":"¿La dijiste bien?","Yes":"Sí","I heard":"Escuché","Listen to it, then say it again to practice. Your first try is the one that counts.":"Escúchala y vuelve a decirla para practicar. Cuen o, en el semáforo, a la izquierda.","Pregunta si está lejos."],["No, solo unos diez minutos a pie.","Pregunta si también hay un autobús."],["Sí, la línea 5 va directo a la estación.","Da las gracias y di que vas a ir caminando."]]},"a2-weekend":{"t":"Planes para el fin de semana","set":"Un colega te pregunta por tu fin de semana.","turns":[["¿Y qué hiciste el fin de semana?","Di que el sábado visitaste a unos amigos."],["¡Qué bien! ¿Y el domingo?","Di que fuiste a pasear al parque."],["¿Ya tienes planes para el próximo fin de semana?","Di que quieres ir al cine."],["Ah, ¿puedo ir contigo?","Di que sí, claro, y propón el sábado en la noche."]]},"b1-interview":{"t":"Entrevista de trabajo: científico de datos","set":"Estás en una entrevista de trabajo para un puesto de ciencia de datos.","turns":[["Cuéntenos algo sobre usted, por favor.","Preséntate: nombre, profesión y años de experiencia."],["¿Con qué herramientas prefiere trabajar?","Di que trabajas sobre todo con Python y SQL."],["¿Puede describir un proyecto del que esté orgulloso?","Di que desarrollaste un modelo que predice la demanda de los clientes."],["¿Por qué quiere trabajar con nosotros?","Di que la empresa trabaja con datos interesantes y que quieres aprender más."]]},"b1-flat":{"t":"Rentar un departamento","set":"Llamas por un anuncio de un departamento.","turns":[["Hola, ¿llama por el departamento?","Di que sí y pregunta si todavía está disponible."],["Sí, todavía está disponible. ¿Tiene preguntas?","Pregunta cuánto es la renta con los gastos adicionales (Nebenkosten)."],["La renta con calefacción incluida es de 950 euros al mes.","Pregunta si puedes ver el departamento esta semana."],["¿Le queda bien el jueves a las 6 de la tarde?","Di que te queda bien y pide la dirección exacta."]]},"b1-standup":{"t":"Reunión diaria del equipo","set":"Tu líder de equipo te pide tu actualización en la reunión de la mañana.","turns":[["¡Buenos días! ¿Qué hiciste ayer?","Di que limpiaste los datos y corregiste algunos errores."],["Bien. ¿Y qué tienes planeado para hoy?","Di que hoy vas a entrenar el nuevo modelo."],["¿Hay algún problema?","Di que necesitas acceso a la base de datos."],["Bueno, yo me encargo. ¿Cuándo va a estar listo el informe?","Di que probablemente esté listo el viernes."]]},"b2-results":{"t":"Presentar resultados de un análisis","set":"Presentas los resultados de un análisis ante los gerentes.","turns":[["¿Cuáles son los resultados más importantes de su análisis?","Di que las ventas subieron un 12 por ciento, sobre todo gracias a la nueva campaña."],["¿Qué tan seguro está de estas cifras?","Di que el resultado es estadísticamente significativo, pero que la muestra es pequeña."],["¿Podría haber también otras razones para el aumento?","Di que correlación no implica causalidad y que recomendarías una prueba A/B."],["¿Qué propone como siguiente paso?","Propón recopilar más datos durante tres meses y luego volver a evaluar."]]},"b2-complaint":{"t":"Presentar una queja","set":"Llamas al servicio al cliente porque tu laptop nueva está descompuesta.","turns":[["Servicio al cliente, mi nombre es Meyer. ¿En qué le puedo ayudar?","Explica que compraste una laptop la semana pasada y que ya no prende."],["Lo siento. ¿Ya intentó reiniciarla?","Di que sí, varias veces, pero no pasó nada."],["Entonces podemos mandar a reparar el equipo. Eso tarda unas dos semanas.","Di que es demasiado tiempo y pide mejor un reemplazo."],["De acuerdo, le puedo ofrecer un cambio.","Da las gracias y pregunta qué tienes que llevar a la tienda."]]},"b2-ai":{"t":"Hablar de la IA en el trabajo","set":"Un amigo quiere saber tu opinión sobre la inteligencia artificial.","turns":[["¿Crees que la inteligencia artificial va a reemplazar muchos empleos?","Da tu opinión: algunas tareas se van a automatizar, pero van a surgir nuevos empleos."],["¿Y en tu área, la ciencia de datos?","Di que la IA te ayuda a trabajar más rápido, pero que las personas todavía tienen que interpretar los resultados."],["¿Te preocupa la protección de datos?","Di que sí, que las empresas deberían ser más transparentes sobre cómo usan los datos."],["¿Qué les aconsejarías a los jóvenes que quieren entrar al mundo de la informática?","Aconséjales aprender las bases de la estadística y nunca dejar de aprender."]]},"c1-salary":{"t":"Negociación salarial","set":"Negocias tu salario para un nuevo trabajo de ciencia de datos.","turns":[["Nos da gusto poder ofrecerle el puesto. Habíamos pensado en 65.000 euros al año.","Da las gracias y di que, dada tu experiencia, esperabas 75.000."],["Lamentablemente, eso está por encima de nuestro presupuesto para este puesto.","Di que lo entiendes y pregunta si sería posible un bono o más días de vacaciones."],["Un bono sí lo podríamos considerar, dependiendo de su desempeño.","Pregunta cómo se mediría exactamente el desempeño."],["Con objetivos claros que definiremos juntos. ¿Estaría de acuerdo con eso?","Acepta, con la condición de que el salario se revise después de un año."]]},"c1-debate":{"t":"Debate: trabajo remoto","set":"En una mesa redonda debates sobre el trabajo desde casa.","turns":[["Muchos jefes dicen que la productividad baja con el home office. ¿Usted qué opina?","Manifiesta tu desacuerdo con cortesía: los estudios muestran lo contrario, al menos en el trabajo que requiere concentración."],["Pero ¿no se ve afectado el espíritu de equipo?","Reconoce el punto, pero di que las reuniones regulares en la oficina pueden compensarlo."],["¿Y qué pasa con quienes recién empiezan su carrera y tienen mucho que aprender?","Di que es una objeción válida y que para ellos la mentoría es especialmente importante."],["Entonces, ¿cuál sería su conclusión?","Concluye que un modelo híbrido combina las ventajas de ambos."]]}},"s":{"s-a1-day":{"es":"Me llamo Luis. Vivo en Berlín. Todas las mañanas me levanto a las siete. Me tomo un café y me como un pancito. Después voy en bicicleta al trabajo. Trabajo como científico de datos. En la noche cocino y leo un libro.","qs":[["¿A qué hora se levanta Luis?",["A las siete","A las ocho","A las seis"]],["¿Cómo va al trabajo?",["En bicicleta","En autobús","A pie"]],["¿Qué hace en la noche?",["Cocina y lee","Ve la tele","Sale a correr"]]]},"s-a1-shop":{"es":"Anna va al supermercado. Necesita leche, huevos y manzanas. Hoy las manzanas están baratas. Un kilo cuesta solo dos euros. En la caja, Anna paga con tarjeta. Después se va a su casa.","qs":[["¿Qué necesita Anna?",["Leche, huevos y manzanas","Pan y queso","Agua y café"]],["¿Cuánto cuesta un kilo de manzanas?",["Dos euros","Tres euros","Un euro"]],["¿Cómo paga?",["Con tarjeta","En efectivo","Con el celular"]]]},"s-a2-hh":{"es":"El fin de semana pasado fui a Hamburgo con mi novia. Tomamos el tren porque es más rápido que el autobús. El sábado visitamos el puerto y comimos sándwiches de pescado. Por desgracia, llovió todo el día. El domingo el clima estuvo mejor y fuimos a pasear a orillas del Elba.","qs":[["¿Cómo viajaron?",["En tren","En autobús","En carro"]],["¿Qué tiempo hizo el sábado?",["Llovió todo el día","Hizo sol","Nevó"]],["¿Qué hicieron el domingo?",["Pasearon a orillas del Elba","Visitaron un museo","Fueron de compras"]]]},"s-a2-doc":{"es":"Desde hace tres días tengo dolor de garganta y fiebre. Hoy en la mañana llamé al médico y me dieron una cita. El médico me revisó y me dijo que tengo un resfriado. Tengo que tomar mucho té y quedarme dos días en casa. También me dio una incapacidad para el trabajo.","qs":[["¿Desde hace cuánto está enferma la persona?",["Tres días","Una semana","Un día"]],["¿Qué dice el médico?",["Que es un resfriado","Que es gripe","Que no tiene nada"]],["¿Qué más le dio el médico?",["Una incapacidad para el trabajo","Una inyección","Antibióticos"]]]},"s-b1-proj":{"es":"Nuestro equipo recibió un proyecto nuevo: tenemos que predecir cuántos clientes van a cancelar el próximo mes. Primero tuvimos que limpiar los datos, porque faltaban muchos valores. Después comparamos distintos modelos. El mejor modelo alcanza una precisión del 87 por ciento. Mi jefa está contenta, pero quiere que expliquemos los resultados de forma más sencilla para que también la dirección los entienda.","qs":[["¿Qué tiene que predecir el equipo?",["Cuántos clientes van a cancelar","Las ventas del próximo mes","Los precios de los productos"]],["¿Por qué tuvieron que limpiar los datos?",["Faltaban muchos valores","Había demasiados datos","El formato estaba mal"]],["¿Qué quiere la jefa?",["Una explicación más sencilla de los resultados","Un modelo mejor","Que trabajen más rápido"]]]},"s-b1-flat":{"es":"Desde hace dos meses busco un departamento nuevo en Múnich, pero no es fácil. Las rentas son muy altas y en cada visita hay por lo menos otras veinte personas. La semana pasada por fin encontré un departamento que me gusta: dos habitaciones, un balcón y solo diez minutos al trabajo. Mandé mis documentos de inmediato y espero que me lo den.","qs":[["¿Por qué es difícil encontrar departamento?",["Las rentas son altas y hay mucha gente","No hay departamentos","Las zonas son malas"]],["¿Qué tiene el departamento?",["Dos habitaciones y un balcón","Un jardín","Tres habitaciones"]],["¿Qué hizo la persona?",["Mandó los documentos de inmediato","Firmó el contrato","Llamó al propietario"]]]},"s-b2-ai":{"es":"La inteligencia artificial forma parte de nuestra vida cotidiana desde hace tiempo, aunque muchas veces no nos demos cuenta. Nos recomienda películas, traduce textos y reconoce caras en fotos. Sus defensores destacan que estos sistemas pueden ahorrar mucho tiempo y reducir errores. Los críticos, en cambio, advierten que las decisiones podrían volverse poco transparentes y que los datos personales podrían usarse de forma indebida. Por eso es aún más importante crear reglas claras, sin frenar la innovación.","qs":[["¿Qué dicen los defensores?",["Que la IA ahorra tiempo y reduce errores","Que la IA crea empleos","Que la IA es barata"]],["¿Sobre qué advierten los críticos?",["Decisiones poco transparentes y uso indebido de datos","El desempleo","Los costos altos"]],["¿Cuál es la conclusión?",["Reglas claras sin frenar la innovación","Hay que prohibir la IA","No hacen falta reglas"]]]},"s-b2-home":{"es":"Desde la pandemia, muchos empleados trabajan desde casa, al menos parte del tiempo. Según una encuesta reciente, lo que más valoran es el tiempo que ganan al no tener que trasladarse al trabajo. Sin embargo, algunos también mencionan la soledad y la dificultad de separar el trabajo del tiempo libre. Por eso, muchas empresas apuestan por un modelo híbrido en el que el personal va a la oficina dos o tres días a la semana.","qs":[["¿Qué es lo que más valoran los empleados?",["El tiempo que ahorran al no trasladarse","Un sueldo más alto","Un lugar tranquilo para trabajar"]],["¿Qué problemas mencionan algunos?",["La soledad y separar el trabajo del tiempo libre","El internet lento","El ruido en casa"]],["¿Qué hacen muchas empresas?",["Un modelo híbrido con 2 o 3 días en la oficina","Todos vuelven a la oficina","Trabajo 100 % remoto"]]]}},"p":{"0":["Ich ___ aus Chile.",["komme","kommst","kommt","kommen"]],"1":["¿Qué significa “das Brot”?",["pan","mantequilla","queso","agua"]],"2":["___ heißt du?",["Wie","Was","Wo","Wer"]],"3":["¿Qué artículo? ___ Katze",["die","der","das","den"]],"4":["Wir ___ jeden Morgen Kaffee.",["trinken","trinkt","trinke","trinkst"]],"5":["Gestern ___ ich ins Kino gegangen.",["bin","habe","war","hatte"]],"6":["Ich habe ___ Bruder und eine Schwester.",["einen","ein","einem","eine"]],"7":["Ich fahre mit ___ Bus zur Arbeit.",["dem","den","der","das"]],"8":["¿Qué significa “die Rechnung”?",["la cuenta","la calculadora","el derecho","la calle"]],"9":["Er ___ heute nicht kommen, er ist krank.",["kann","kannst","können","könnt"]],"10":["Ich bleibe zu Hause, ___ ich krank bin.",["weil","denn","deshalb","obwohl"]],"11":["Ich weiß nicht, ___ er morgen kommt.",["ob","wenn","dass","als"]],"12":["Das ist der Kollege, ___ ich gestern getroffen habe.",["den","der","dem","desse function CH(){

  c.xp=c.xp||0; c.medals=c.medals||{}; c.best60=c.best60||0; c.freeze=c.freeze||0; c.chests=c.chests||0; c.wotdN=c.wotdN||0;

function wordKey(w){return (w.art?w.art+' ':'')+w.de}
function checkWord(v,w){
  var t=toks(v).map(function(x){return x.n}), art=w.art, wd=norm(w.de);
  var given=t.join(' '), full=norm(wordKey(w));
  if(given===full) return {ok:true};
  var hasArt=art&&['der','die','das'].indexOf(t[0])>-1, rest=hasArt?t.slice(1).join(' '):given;
  var wordOk=rest===wd||(wd.length>=5&&lev(rest,wd)<=1);
  if(art&&wordOk&&!hasArt) return {ok:false,note:tl('Right word, but add the article.')};
  if(art&&wordOk&&t[0]!==art) return {ok:false,note:tl('Right word, wrong article.')};
  if(wordOk) return {ok:true,typo:rest!==wd};
  return {ok:false};
}

var CASE_T=[
 ['nom','def','___ {N} ist hier.',tl('Who or what is here? The subject is in the Nominativ.')],

 ['dat','def','Was machen wir mit ___ {N}?',tl('mit always takes the Dativ.')],
 ['dat','def','Ich bin zufrieden mit ___ {N}.',tl('mit always takes the Dativ.')],

function makeCase(w,ti){

  var s=T[2].replace('{N}',w.de); if(s.indexOf('___')===0) ans=ans.charAt(0).toUpperCase()+ans.slice(1), opts=opts.map(function(o){return o.charAt(0).toUpperCase()+o.slice(1)});

}

function weekStart(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function bars(data,label,unit){
  var W=320,H=140,pad=22,max=Math.max.apply(null,data.map(function(d){return d.v}).concat([1])),bw=(W-8)/data.length;
  var top=Math.ceil(max/5)*5||5;
  var s='<svg viewBox="0 0 '+W+' '+(H+pad)+'" class="chart" role="img" aria-label="'+esc(label)+'">';
  s+='<line x1="0" x2="'+W+'" y1="'+H+'" y2="'+H+'" stroke="var(--line)"/>';
  s+='<text x="'+W+'" y="10" text-anchor="end" class="cl">'+top+'</text><line x1="0" x2="'+(W-24)+'" y1="6" y2="6" stroke="var(--line)" stroke-dasharray="2 4"/>';
  data.forEach(function(d,i){
    var h=d.v/top*(H-8), x=4+i*bw+bw*0.18, w=bw*0.64;
    s+='<g class="bar"><title>'+esc(d.k+': '+d.v+' '+unit)+'</title><rect x="'+(i*bw+4)+'" y="0" width="'+bw+'" height="'+H+'" fill="transparent"/>';
    if(d.v) s+='<path d="M'+x+' '+H+'V'+(H-h+4)+'q0-4 4-4h'+(w-8)+'q4 0 4 4V'+H+'z" fill="var(--ink)" opacity="'+(i===data.length-1?1:.55)+'"/>';
    s+='</g>';
    if(i%Math.ceil(data.length/7)===0||i===data.length-1) s+='<text x="'+(x+w/2)+'" y="'+(H+15)+'" text-anchor="middle" class="cl">'+esc(d.s)+'</text>';
  });
  return s+'</svg>';
}
function vStats(){

// Keyboard shortcuts for computers: 1-5 pick an answer, Enter / Space for next, arrows in verb cards, Esc to exit
function keyNav(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var m=document.getElementById('main'), tag=e.target.tagName;
  if(e.key==='Escape'){var x=m.querySelector('.qtop .exit, .qtop [data-a=vlesson]');if(x){e.preventDefault();x.click()}return}
  if(/^(INPUT|TEXTAREA|SELECT|BUTTON|SUMMARY|A)$/.test(tag)) return;
  var click=function(sel){var b=m.querySelector(sel);if(b&&!b.disabled){e.preventDefault();b.click();return true}return false};
  if(/^[1-5]$/.test(e.key)){
    var n=+e.key-1;
    if(m.querySelector('[data-a=good]')){click(n===0?'[data-a=again]':'[data-a=good]');return}
    var groups=m.querySelectorAll('.opts');
    for(var i=0;i<groups.length;i++){
      var bs=[].filter.call(groups[i].querySelectorAll('button[data-a]'),function(b){return /^(qpick|plpick|rdpick|tapick)$/.test(b.dataset.a)});
      if(bs.length&&!bs[0].disabled){if(bs[n]){e.preventDefault();bs[n].click()}return}
    }
    return;
  }
  if(e.key==='Enter'||e.key===' '){click('[data-a=qnext],[data-a=vnext],[data-a=trnext],[data-a=cvnext],[data-a=plnext],[data-a=vlnext],[data-a=vlprac],.btn[data-a=flip]');return}
  if(e.key==='ArrowRight'){click('[data-a=vlnext],[data-a=vlprac]');return}
  if(e.key==='ArrowLeft'){click('[data-a=vlprev]');return}
}
document.addEventListener('change',function(e){
  if(e.target.id!=='bk-file'||!e.target.files||!e.target.files[0]) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result), st=o&&o.state?o.state:o;
      if(!st||typeof st!=='object'||!st.progress) throw 0;
      ui.bkPending={state:st,when:o.exported?new Date(o.exported).toLocaleString():tl('an unknown date')}; ui.bkMsg='';
    }catch(err){ui.bkMsg=tl('That file is not a Wortschatz backup.')}
    render();
  };
  rd.readAsText(e.target.files[0]);
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){
    ui.search=e.target.value;
    document.getElementById('list').innerHTML=listHtml();
  }
});

applyLang();
cloudInit();
render();
})();
</script>
</body>
</html>
